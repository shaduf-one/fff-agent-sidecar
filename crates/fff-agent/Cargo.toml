[package]
name = "fff-agent"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Agent-friendly FFF sidecar CLI without persistent MCP context overhead"

[[bin]]
name = "fff-agent"
path = "src/main.rs"

[dependencies]
blake3 = { workspace = true }
clap = { version = "4", features = ["derive"] }
fff = { package = "fff-search", path = "../fff-core", default-features = false, version = "0.6.4" }
git2 = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = { workspace = true }

[dev-dependencies]
tempfile = "3.8"
